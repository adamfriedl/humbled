# Fictional industry events, one per day, in file order (the simulator starts at the top, so the
# first seven are what a 7-day run sees). `launch: true` is the launch-day seed event.
#
# Write these as believable business news, one notch past real: the kind of headline that makes
# a reader check whether it actually happened. No cartoon premises (dogs as executives, offices
# in tents). The comedy comes from the personas' reactions, so the event just has to be real
# enough to react to, with one precise, petty detail.
- id: synergetix-pod-crackdown
  launch: true
  headline: Synergetix cracks down on engagement pods, comment automation and "comment to agree" posts
  body: Synergetix says its professional feed will now suppress coordinated engagement, automated comments and posts that ask readers to comment "agree". Insiders say the change affects "basically everyone".
- id: layoffs-quick-sync
  headline: Synapse & Sons lays off 200 employees in a 9-minute all-hands titled "Quick sync"
  body: The calendar invite was marked optional. Attendance was 96%.
- id: rto-badge-bonus
  headline: Pivotal Paradigms ties bonuses to badge swipes; employees discover swiping twice counts double
  body: The company has closed the loophole and thanked staff for "surfacing it". Wednesday swipes were up 340% before the fix.
- id: earnings-efficiency
  headline: Synergetix earnings call says "efficiency" 41 times; stock up 6%
  body: The word "employees" appeared once, in the safe harbor statement.
- id: ai-usage-mandate
  headline: CloudNine Dynamics asks staff to use AI for "at least half of all tasks"; a dashboard tracks it
  body: Several teams report typing "hi" into the assistant every morning to stay above target.
- id: top-voice-retired
  headline: Synergetix retires its "Top Voice" badges; 11,000 profiles still display them
  body: Former recipients have been asked to remove the badge "when convenient". Most have not found it convenient.
- id: unassigned-seating
  headline: Leverage Lab moves to unassigned seating; desks book out on the app by 7:02am
  body: Employees who arrive later work from the cafeteria, which the company now calls "a neighborhood".
- id: four-day-week-pilot
  headline: Synergetix pilots a four-day work week for "select teams"
  body: The teams have not yet been selected. A spokesperson said the pilot is "about trust".
- id: meeting-free-wednesday
  headline: OmniSync introduces Meeting-Free Wednesdays; employees schedule a meeting to discuss them
  body: The kickoff meeting is recurring.
- id: focus-streaks
  headline: OmniSync adds "focus streaks" to its calendar app; users block "Focus" over meetings to keep them
  body: The company says meeting attendance is down 18% "for reasons we're investigating".
- id: nap-pods-removed
  headline: Kaizen Kollective removes office nap pods after a "utilization review"
  body: The pods will become phone booths. The review found they were mostly being used as phone booths.
- id: biscuit-series-b
  headline: Blue Ocean Biscuits raises a $40M Series B and says it is now "a platform company"
  body: It has not said what the platform is. Biscuit sales were flat.
- id: rebrand-lowercase
  headline: Paradigm Shift Partners unveils its new logo after a 14-month rebrand; it is the old logo in lowercase
  body: The agency calls it "a quiet confidence".
- id: podcast-listeners
  headline: Thoughtwave Media finds the average B2B podcast episode has 31 listeners, four of them the guests
  body: The company is launching a podcast about the findings.
- id: hiring-pause
  headline: Bandwidth Partners announces a "strategic hiring pause"; recruiters keep posting roles "to build pipeline"
  body: Applicants will be contacted "when the pause lifts". The company has not said when that is.
- id: vc-momentum-fund
  headline: Ascendant Ventures raises a $500M fund for "founders with momentum"
  body: The partners declined to define momentum. Two of the first five checks went to former partners.
- id: ai-posts-survey
  headline: "Survey: 71% of professionals say they can spot AI-written posts; 64% use AI to write theirs"
  body: Nearly every respondent said their own posts "still sound like me".
- id: team-joy-okr
  headline: Kaizen Kollective adds "team joy" to its quarterly OKRs, measured by pulse survey
  body: The Q3 target is 4.2 out of 5. The survey is mandatory.
- id: logistics-ai-rename
  headline: Quantum Leap Logistics relabels its routing software "AI-powered"; stock rises 22%
  body: The software is unchanged. The press release thanked the engineering team, who learned about it from the press release.
- id: clarity-trend-report
  headline: Northstar Alignment Group's leadership report names "clarity" the top trend for a sixth year
  body: The report is 140 pages.
- id: chairs-removed
  headline: Hyperscale Hospitality removes half its office chairs "to encourage movement"
  body: The remaining chairs are in the executive wing, which the memo calls "a different use case".
- id: backchannel-references
  headline: Brightpath Human Capital adds backchannel reference checks for every hire, including interns
  body: Candidates are now asked to list someone who "didn't love working with you".
- id: early-all-hands
  headline: Grindstone Capital moves its all-hands to 6:15am "to respect people's evenings"
  body: Attendance is optional. Attendance is tracked.
- id: cold-plunge-coffee
  headline: Grindstone Capital installs an office cold plunge, removing the second coffee machine to make room
  body: Leadership called it "a trade-up".
- id: pto-preapproval
  headline: Disruptify's unlimited PTO now requires approval 60 days in advance
  body: HR says the policy remains unlimited "in spirit".
- id: async-video-updates
  headline: Disruptify replaces internal email with async video updates
  body: The average update is 7 minutes long and opens with "So, quick one."
- id: grateful-layoff-memo
  headline: Velocity Vertical's layoff memo says "grateful" nine times and "layoff" zero times
  body: Affected employees have been "transitioned to alumni".
- id: endorsement-inflation
  headline: Synergetix adds one-tap skill endorsements; "Leadership" endorsements rise 900%
  body: The most-endorsed user has 4,100 endorsements for Leadership and no direct reports.
- id: agentic-seed-round
  headline: 'Agentic Solutions raises an $8M seed; its deck lists "headcount (incl. agents): 46"'
  body: Human headcount is four. The company says the distinction is "increasingly outdated".
- id: rto-hybrid-redefined
  headline: Synapse & Sons redefines "hybrid" as four days in the office and one day "flexible in-office"
  body: The memo says nothing about the policy has changed except "the words".
