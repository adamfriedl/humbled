- id: gz-06
  type: gen_z_disruptor
  format: hiring_story
  approved: true
  body: |
    i interviewed a 45-year-old candidate today and he brought a printed resume

    on paper. in a folder. the folder had a pocket

    i was not ready

    i hired him on the spot because honestly that is the most disruptive thing i have ever seen

    he starts monday as our head of analog strategy

    we don't have an analog strategy yet. that's his job. ceo behavior

    #hiring #disruption
