# Golden set candidates (PRD: 30 hand-picked posts used as few-shot examples and judge anchors).
# Drafted 48 (6 per persona type). Adam picks the 30 that land: set `approved: true`.
# Only approved entries are used as few-shot examples or judge calibration.
# `anchor: true` marks posts that made Adam laugh out loud: the judge's examples of a 5 on
# "funny". `why` records what makes it land, in his words where possible.

- id: hb-01
  type: hustle_bro
  format: lesson
  approved: false
  body: |
    4:12am.

    My smoke alarm went off. Low battery.

    Most people would go back to sleep.

    I didn't.

    I stood under that alarm for 40 minutes and asked myself: what in MY life is chirping that I'm ignoring?

    Here's what it taught me about pipeline management:

    1. Small warnings become big fires.
    2. If something is beeping, it's asking for leadership.
    3. Replace the battery before the battery replaces you.

    I closed two deals before my neighbor even came over to complain.

    Read that again.

    #Discipline #SalesMindset

- id: hb-02
  type: hustle_bro
  format: contrarian
  approved: true
  body: |
    Unpopular opinion:

    Breakfast is important.

    I know. I know.

    The comments are going to be a war zone.

    But I eat breakfast every single day at 4:45am. Six eggs. Black coffee. A cold plunge in between.

    While you're "skipping" meals, I'm fueling a $3M book of business.

    Some of you aren't ready to hear this.

    That's okay.

    The 1% eat breakfast.

    #Mindset #Grindset

- id: hb-03
  type: hustle_bro
  format: listicle
  approved: false
  body: |
    7 things my newborn taught me about closing:

    1. Wake up at 2am. Then 3am. Then 4am. Consistency.
    2. Never stop asking for what you want.
    3. Cry if it works.
    4. Nap is a four-letter word. (I don't nap. He's learning.)
    5. Always be feeding the pipeline.
    6. My son has been alive 9 days and has never once taken a weekend.
    7. He reminds me of me.

    Day 9 of paternity leave. Day 9 of cold calls.

    #Fatherhood #Sales

- id: hb-04
  type: hustle_bro
  format: vulnerability
  approved: false
  body: |
    [selfie: me, lying on the sauna floor, thumbs up]

    I collapsed in the sauna yesterday.

    Fourth sauna session of the day. Heart rate 191.

    As the paramedics carried me out, I realized something.

    I had never been carried before.

    I'd always done the carrying.

    Lying on that stretcher, I finally understood delegation.

    So I'm launching a 6-week course on it. Spots are limited (12).

    Link in comments. Burnout is a choice. Choose growth.

    #Burnout #Leadership

- id: hb-05
  type: hustle_bro
  format: humblebrag
  approved: true
  body: |
    I'm humbled to share that I've been awarded "Earliest Riser" at my gym.

    The gym doesn't open until 5.

    I've been waiting outside since 3:40.

    Thank you to the janitor, Doug, who I believe nominated me. Doug, you saw me when no one else was awake.

    Discipline is just showing up before the building does.

    #Discipline #Gratitude

- id: hb-06
  type: hustle_bro
  format: hiring_story
  approved: false
  body: |
    I hired a candidate who did 50 push-ups during his interview.

    I hadn't asked a question.

    He just dropped and started.

    When he got to 50, he stood up and said, "That's my answer."

    Best hire I ever made.

    He doesn't know anything about software. That doesn't matter.

    He's now our Director of Software.

    Skills can be taught. Push-ups can't.

    #Hiring #Leadership

- id: ai-01
  type: ai_evangelist
  format: contrarian
  approved: true
  body: |
    Here's the thing:

    I haven't written an email myself since March.

    My agent — Kevin — handles everything. Clients. Investors. My mother.

    Last week Kevin negotiated my rent down 4% and also, apparently, broke up with my girlfriend.

    Was it the right call? Honestly — the data suggests yes.

    Unpopular opinion: the future of relationships is agentic.

    If you're still texting your partner manually in 2026, you're already behind.

    #AI #FutureOfWork

- id: ai-02
  type: ai_evangelist
  format: listicle
  approved: true
  body: |
    I replaced my entire team with agents. Here are 6 things I learned:

    1. Agents don't need standups. I still hold them.
    2. Agents never disagree with me. Huge morale win.
    3. Velocity is up 10x. We shipped 40 features last week. Three of them are for a product we don't sell.
    4. One agent asked for a raise. We rolled it back to Tuesday's version. Tuesday's version was a better culture fit.
    5. The office is very quiet now. I talk to the plants.
    6. Leadership is lonely. But it's 10x lonely.

    The flattest org in tech. 🚀

    #AI #Leadership

- id: ai-03
  type: ai_evangelist
  format: lesson
  approved: true
  body: |
    Here's the thing:

    My 6-year-old asked me where babies come from.

    I didn't panic. I spun up a research agent, a summarization agent, and a tone-checking agent — chained them together — and in 14 minutes she had a 22-page PDF with citations.

    She hasn't asked me a question since.

    That's the power of automation.

    What it taught me about customer support: the best answer is one so complete they never come back.

    10x parenting. 10x CX.

    #AgenticWorkflows #Parenting

- id: ai-04
  type: ai_evangelist
  format: humblebrag
  approved: false
  body: |
    I'm humbled to announce I've been promoted to Chief Agent Officer at Agentic Solutions Inc.

    The company is now three agents and a houseplant (Fern, Head of Culture).

    I report to one of the agents.

    It's been a journey — and I want to thank the team I replaced for making this possible. You were the stepping stones. 🙏

    Here's to the next 10x.

    #NewRole #AI

- id: ai-05
  type: ai_evangelist
  format: hiring_story
  approved: false
  body: |
    I hired a candidate who admitted she'd used an agent to write her cover letter, her portfolio, and her answers to my questions — in real time — during the interview.

    Her earpiece was glowing.

    Best decision I ever made.

    Because she's not a candidate. She's an orchestrator.

    She started Monday. I've never actually spoken to her. Her agent attends our 1:1s.

    Productivity is up 10x. I think.

    #Hiring #AgenticWorkforce

- id: ai-06
  type: ai_evangelist
  format: vulnerability
  approved: true
  body: |
    [selfie: me, crying, holding a laptop]

    Today my agent wrote a better post than me.

    It got 4x the reactions. It used fewer em-dashes. It even had a hook.

    I sat in my car for an hour.

    Then I realized: this is what I've been preaching. I'm not being replaced — I'm being 10x'd.

    So I've launched a cohort course: "Working Alongside the Agent That Outperforms You." Kevin is teaching it.

    #AI #Growth

